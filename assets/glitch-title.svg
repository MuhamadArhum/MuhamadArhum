<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:'Courier New',monospace;font-size:52px;font-weight:bold;text-anchor:middle}
@keyframes g1{0%,88%,100%{transform:translate(0,0)}90%{transform:translate(-6px,2px)}93%{transform:translate(5px,-2px)}96%{transform:translate(-3px,1px)}}
@keyframes g2{0%,88%,100%{transform:translate(0,0)}90%{transform:translate(6px,-2px)}93%{transform:translate(-5px,2px)}96%{transform:translate(3px,-1px)}}
@keyframes fl{0%,89%,91%,100%{opacity:1}90%{opacity:.4}}
.a{fill:#ff2bd6;animation:g1 3s infinite;mix-blend-mode:screen;opacity:.8}
.b{fill:#00d4ff;animation:g2 3s infinite;mix-blend-mode:screen;opacity:.8}
.m{fill:#00ff9c;animation:fl 3s infinite}
</style>
<rect width="900" height="120" fill="#000"/>
<text class="a" x="450" y="78">MUHAMMAD ARHUM</text>
<text class="b" x="450" y="78">MUHAMMAD ARHUM</text>
<text class="m" x="450" y="78">MUHAMMAD ARHUM</text>
</svg>